<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khaled Hossain — Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      /* Set before first paint so the boot overlay covers the page while
         sections + the Three.js hero are still loading. Added by JS so a
         no-JS visitor never gets stuck behind the overlay. */
      document.documentElement.classList.add("is-booting");
      /* Last-resort release: if the module graph never runs at all (e.g. the
         Three.js CDN is unreachable), the page must still show itself. */
      setTimeout(function () {
        document.documentElement.classList.remove("is-booting");
      }, 8000);
    </script>
  </head>
  <body>
    <!-- Grain overlay -->
    <div class="grain-overlay" aria-hidden="true"></div>

    <!-- Boot overlay: held up until sections + hero animation are ready -->
    <div
      class="boot-loader"
      id="boot-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading"
    >
      <div class="boot-loader-inner">
        <span class="boot-loader-spinner" aria-hidden="true"></span>
        <span class="boot-loader-text">Loading terrain</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav id="nav">
      <a href="#hero" class="nav-name">Khaled Hossain</a>
      <div class="nav-links">
        <a href="#work-experience">Work</a>
        <a href="#projects">Projects</a>
        <a href="#education">Education</a>
        <a
          href="https://khaled2049.github.io/devlog"
          target="_blank"
          rel="noopener noreferrer"
          >Blog</a
        >
      </div>
      <button
        class="nav-hamburger"
        id="nav-hamburger"
        aria-label="Toggle menu"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>
    </nav>

    <!-- Mobile nav drawer -->
    <div class="nav-drawer" id="nav-drawer" aria-hidden="true">
      <a href="#work-experience">Work experience</a>
      <a href="#projects">Projects</a>
      <a href="#education">Education</a>
      <a
        href="https://khaled2049.github.io/devlog"
        target="_blank"
        rel="noopener noreferrer"
        >Blog</a
      >
    </div>

    <script>
      (function () {
        var btn = document.getElementById("nav-hamburger");
        var drawer = document.getElementById("nav-drawer");
        var open = false;

        function setOpen(state) {
          open = state;
          btn.setAttribute("aria-expanded", open);
          drawer.setAttribute("aria-hidden", !open);
          btn.classList.toggle("is-open", open);
          drawer.classList.toggle("is-open", open);
        }

        btn.addEventListener("click", function () {
          setOpen(!open);
        });

        drawer.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", function () {
            setOpen(false);
          });
        });
      })();
    </script>

    <!-- Sections are injected here by main.js -->
    <main id="page-content"></main>

    <!-- Footer -->
    <footer>
      <div class="footer-links">
        <a
          href="https://github.com/Khaled2049"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
        <a
          href="https://www.linkedin.com/in/khaledhossainn/"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
        <a
          href="https://khaled2049.github.io/"
          target="_blank"
          rel="noopener noreferrer"
          >Blog</a
        >
        <a href="mailto:khaledhossain.not@gmail.com">Email</a>
      </div>
    </footer>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
