<section id="hero">
  <canvas id="terrain-canvas" aria-hidden="true"></canvas>
  <div class="hero-scanlines" aria-hidden="true"></div>
  <div
    class="hero-loading"
    id="hero-loading"
    aria-busy="true"
    aria-live="polite"
    aria-label="Loading 3D scene"
  >
    <div class="hero-loading-inner">
      <span class="hero-loading-spinner" aria-hidden="true"></span>
      <span class="hero-loading-text">Loading terrain</span>
    </div>
  </div>
  <div class="hero-content">
    <h1 class="hero-name">Khaled<br />Hossain</h1>
    <p class="hero-terminal">&gt; currently: Denver, CO</p>
    <div class="hero-arrow" aria-hidden="true">&#8595;</div>
  </div>
</section>
